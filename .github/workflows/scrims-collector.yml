name: BSCSTATS Scrims Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bscstats-scrims-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger secure Supabase scrim collector
        env:
          SUPERCELL_API_KEY: ${{ secrets.SUPERCELL_API_KEY }}
        run: |
          if [ -z "$SUPERCELL_API_KEY" ]; then
            echo "Missing SUPERCELL_API_KEY repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-supercell-api-key: $SUPERCELL_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://xjncfrxsnriyikfkpkbs.supabase.co/functions/v1/collect-scrims"
